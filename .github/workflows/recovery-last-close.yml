name: PSX Recovery Last Close

on:
  schedule:
    - cron: '45 4 * * 1-5'
    - cron: '45 5 * * 1-5'
    - cron: '45 6 * * 1-5'
    - cron: '45 7 * * 1-5'
    - cron: '45 8 * * 1-5'
    - cron: '45 9 * * 1-5'
    - cron: '45 10 * * 1-4'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.recovery-kick']

permissions:
  contents: write

concurrency:
  group: psx-recovery-last-close
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Karachi
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements-ci.txt
      - name: Refresh news and run last-close recovery analysis
        run: |
          python news_fetcher.py || echo "news refresh failed; preserving prior news file"
          python main.py cached-run
      - name: Publish recovery state
        run: |
          git config user.name "psx-recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- psx_engine.db news_raw_24h.json .engine-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Recovery last-close run $(date -u +'%Y-%m-%dT%H:%MZ')"
          git pull --rebase origin main
          git push origin HEAD:main
