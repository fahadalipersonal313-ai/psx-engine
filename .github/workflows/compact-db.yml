name: One-shot SQLite compact

on:
  push:
    branches: [main]
    paths: ['.compact-db-kick']

permissions:
  contents: write

concurrency:
  group: psx-db-maintenance
  cancel-in-progress: false

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 1
      - name: Require engine pause and compact databases
        run: |
          test -f .engine-paused || { echo "Refusing DB maintenance while engine is live"; exit 1; }
          python - <<'PY'
          import os, sqlite3
          for path in ("psx_engine.db", "intraday_observations.db"):
              before=os.path.getsize(path)
              con=sqlite3.connect(path)
              try:
                  con.execute("PRAGMA integrity_check").fetchone()
                  con.execute("VACUUM")
                  ok=con.execute("PRAGMA integrity_check").fetchone()[0]
                  if ok != "ok":
                      raise RuntimeError(f"{path} integrity_check={ok}")
              finally:
                  con.close()
              after=os.path.getsize(path)
              print(f"{path}: {before} -> {after} bytes ({before-after:+d} reclaimed)")
          PY
      - name: Commit only compacted live databases
        run: |
          git config user.name "psx-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -- psx_engine.db intraday_observations.db
          if git diff --cached --quiet; then
            echo "VACUUM produced no binary change"
            exit 0
          fi
          git commit -m "maintenance: compact live SQLite state"
          git pull --rebase origin main
          git push origin HEAD:main
