name: psx-diagnose

# One-shot, read-only check of what PSX returns to a GitHub runner. Sends the
# engine's own requests once each, never retries, never disguises itself.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe | discover | downloads | sources | reconcile | dump | index | index2 | index3 | kse100'
        default: 'probe'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - run: pip install -r requirements-ci.txt
      - run: |
          case "${{ inputs.mode || 'probe' }}" in
            discover)  python tools/psx_diagnose.py --discover ;;
            downloads) python tools/psx_diagnose.py --downloads ;;
            sources)   python tools/source_probe.py ;;
            reconcile) python tools/reconcile_mkt_summary.py ;;
            dump)      python tools/dump_mkt_summary.py ;;
            index)     python tools/index_probe.py ;;
            index2)    pip install -q pypdf && python tools/index_probe2.py ;;
            index3)    python tools/index_probe3.py ;;
            names)     python tools/company_names.py ;;
            kse100)    pip install -q pypdf && cp psx_engine.db /tmp/probe.db && PSX_DB_PATH=/tmp/probe.db python psx_index_pdf.py 2026-07-13 2026-09-29 ;;
            *)         python tools/psx_diagnose.py ;;
          esac
