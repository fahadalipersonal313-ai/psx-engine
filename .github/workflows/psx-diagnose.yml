name: psx-diagnose

# One-shot, read-only check of what PSX returns to a GitHub runner. Sends the
# engine's own requests once each, never retries, never disguises itself.
# `reconcile` re-checks the official mkt_summary download against banked bars.
# (The one-off index/source probes used during the 2026-09-25 outage were
# retired on 2026-10-07; they are in git history.)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe | discover | downloads | reconcile'
        default: 'probe'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - run: pip install -r requirements-ci.txt
      - run: |
          case "${{ inputs.mode || 'probe' }}" in
            discover)  python tools/psx_diagnose.py --discover ;;
            downloads) python tools/psx_diagnose.py --downloads ;;
            reconcile) python tools/reconcile_mkt_summary.py ;;
            *)         python tools/psx_diagnose.py ;;
          esac
