name: news-routine

# Fetches raw last-24h headlines for every symbol + macro feeds and commits
# news_raw_24h.json. Runs AUTOMATICALLY every hour through the trading session
# (cron below, gated by news_window.py) so no manual "Run the repo news" prompt
# is needed — the dashboard reads the raw file
# and shows the headlines per symbol UNSCORED, for manual cross-verification.
# (News carries ZERO score weight as of 2026-07-15; the old LLM-judged
# news_signals.json step is optional and only matters if weights are restored.)
on:
  schedule:
    # HOURLY through the trading session (2026-08-21). Cron is UTC and PKT is
    # UTC+5, so 04:05Z = 09:05 PKT. The range runs to 11:05Z (16:05 PKT) to
    # cover Friday's later close; `news_window.py` is what actually decides
    # whether a firing does any work, because cron cannot express holidays or a
    # different Friday close. Mon-Thu firings after 15:30 PKT exit immediately.
    - cron: '5 4-11 * * 1-5'        # 09:05-16:05 PKT, hourly
  workflow_dispatch:
    inputs:
      window_hours:
        description: "Lookback window in hours (default 24; use 96 for a 4-day backfill)"
        required: false
        default: "24"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests anthropic
      - name: Session window check (weekday, holiday, PSX hours)
        id: window
        # Never fails the job: outside the window every later step is skipped
        # and the run goes green having done nothing. A red X every hour
        # overnight would train us to ignore this workflow's failures.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual dispatch — window check bypassed"
            echo "run=1" >> "$GITHUB_OUTPUT"
          elif python news_window.py; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch news
        if: steps.window.outputs.run == '1'
        env:
          # Empty on scheduled (cron) runs — fall back to 24 so int() never sees "".
          NEWS_WINDOW_HOURS: ${{ inputs.window_hours || '24' }}
        run: python news_fetcher.py
      - name: AI news rating (second opinion, unweighted)
        if: steps.window.outputs.run == '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        # Claude Haiku 4.5 is primary; GLM runs only when no Anthropic key is
        # configured, so the dashboard keeps a second opinion either way.
        # `|| true` on both: a rating outage must never block the news commit,
        # but it DOES mean a failure is invisible in the step conclusion —
        # read the step LOG (401 = bad key, timeout = slow endpoint).
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python news_claude.py || true
          else
            echo "ANTHROPIC_API_KEY unset — falling back to GLM"
            python news_glm.py || true
          fi
      - name: Commit raw news
        if: steps.window.outputs.run == '1'
        run: |
          git config user.name  "psx-news-bot"
          git config user.email "psx-news-bot@users.noreply.github.com"
          git add news_raw_24h.json news_ai_ratings.json news_glm_ratings.json 2>/dev/null || git add news_raw_24h.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "news raw fetch $(date -u +'%Y-%m-%dT%H:%MZ')"
          git pull --rebase -X theirs --autostash origin main || git rebase --abort
          for i in 1 2 3 4; do
            git push origin main && break
            sleep $((2 ** i))
          done
