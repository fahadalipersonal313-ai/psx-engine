name: mettis-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: pip install -q requests
      - name: Real Mettis yield with the new article-date parser
        run: |
          python - <<'PY'
          import datetime, logging, mettis_scraper
          logging.basicConfig(level=logging.INFO, format="%(levelname)s %(message)s")
          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=24)
          items, fails = mettis_scraper.fetch(cutoff)
          print(f"\n=== {len(items)} items in the 24h window, failures={fails}")
          for it in items[:15]:
              print(f"  [{it['symbol']:7}] {it['published'][:16]}  {it['title'][:70]}")
          PY
