name: PSX Engine Loop

# CONTINUOUS MODE (2026-07-12): instead of one run per trigger, the job loops
# for the whole PSX session — run → commit → sleep RUN_INTERVAL → repeat — until
# after market close, then exits. So the dashboard keeps getting fresh signals
# without depending on a perfectly regular external ping.
#
# Kickoff / self-healing: any of the triggers below starts the loop. The
# `concurrency` group means only ONE loop runs at a time; extra triggers queue.
# If the running loop ever dies mid-session, the next queued trigger (the
# external cron-job.org pinger, or the backup cron) picks up and resumes it —
# the pinger doubles as a watchdog. A trigger that lands after close just exits
# immediately (outside-hours guard), so queued pings are harmless.
#
# GitHub's own cron proved unreliable here, so the 09:45 PKT cron below is a
# backup kickoff only; the primary kickoff is the external pinger / manual run.
on:
  schedule:
    # Multiple staggered morning kickoffs (UTC). GitHub cron is unreliable and
    # often fires late or skips, so several attempts make sure the loop starts
    # even if the external pinger is down. The concurrency group means only ONE
    # loop ever runs — the extra crons are harmless no-ops once one is going,
    # and any that land after close exit immediately via the outside-hours guard.
    # PRE-OPEN kickoffs (2026-08-26). The loop WAITS for MARKET_OPEN rather
    # than exiting, so a kickoff that lands before the open makes the first
    # cycle fire at the open EXACTLY. Measured first-run times show that is the
    # whole story: days a kickoff arrived pre-open started at 09:32 on the dot
    # (08-20/21/25), days it did not started 09:49-09:58 (08-19/24/26). The old
    # earliest cron was 09:10 — only 22 minutes of headroom, and GitHub cron
    # routinely slips 15-40 minutes.
    # Four attempts across 34 minutes now, on OFF-PEAK minutes: GitHub's
    # scheduler is most congested at :00/:15/:30/:45, which is exactly where the
    # old crons sat. All four must slip for the open to be missed.
    # Not earlier than ~08:52: `timeout-minutes: 350` is a 5h50m budget, and
    # every idle pre-open minute is subtracted from the afternoon.
    - cron: '52 3 * * 1-5'          # 08:52 PKT
    - cron: '5 4 * * 1-5'           # 09:05 PKT
    - cron: '17 4 * * 1-5'          # 09:17 PKT
    - cron: '26 4 * * 1-5'          # 09:26 PKT
    - cron: '10 5 * * 1-5'          # 10:10 PKT — mid-morning self-heal
    - cron: '10 6 * * 1-5'          # 11:10 PKT — later self-heal if all above skipped
    # Afternoon hand-over: a loop kicked off at ~08:52 hits the 350-minute
    # timeout around 14:42, before the 15:45 close. These keep a queued run
    # ready to take over for the rest of the session.
    - cron: '40 8 * * 1-5'          # 13:40 PKT
    - cron: '40 9 * * 1-5'          # 14:40 PKT
  workflow_dispatch:      # cron-job.org pinger + manual runs
    inputs:
      force_now:
        description: 'Run ONE cycle immediately, ignoring the session guards (out-of-hours test).'
        type: boolean
        default: false
  # Dependency-free kickoff: pushing ANY change to `.engine-kick` starts the
  # loop. Added 2026-08-18 after BOTH existing triggers failed silently on the
  # same morning (GitHub's scheduler fired nothing for this repo across two
  # workflows; the external pinger went quiet) and the user got no signals.
  # A caller that can push git — but has no GitHub API token — can now start the
  # engine. The path filter matters: the loop commits psx_engine.db every ~15
  # minutes, and an unfiltered push trigger would spawn a run for each one.
  push:
    branches: [main]
    paths: ['.engine-kick']

permissions:
  contents: write          # needed to commit the updated database

concurrency:
  group: psx-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # A single job can run at most 6h on GitHub-hosted runners; the loop below
    # exits at market close (~15:45 PKT) well inside that when kicked off in the
    # morning. If a mid-session kickoff would otherwise run past 6h, the runner
    # cap ends it and the next trigger resumes — no data loss beyond one cycle.
    timeout-minutes: 350
    env:
      TZ: Asia/Karachi            # so `date` below reads Pakistan local time
      EMAIL_MODE: "hourly"        # at most one email per hour during the session
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Continuous session loop (run → commit → sleep → repeat)
        # Loops for the whole trading session. Each cycle runs the engine, then
        # commits the fresh DB with the same conflict-tolerant push used before
        # (binary SQLite can't 3-way-merge, so keep THIS run's DB on conflict and
        # retry if the remote advances). Sleeps RUN_INTERVAL minutes between
        # cycles. Exits on weekend or once the clock passes market close.
        env:
          RUN_INTERVAL_MINUTES: '15'
          # PSX pre-open is 09:15-09:30; REGULAR trading starts 09:32. Opening
          # at 09:15 meant the first cycle of the day scored yesterday's closes
          # and called them today's signals. 09:32 is the first moment a run can
          # reflect real trading.
          MARKET_OPEN: '09:32'
          MARKET_CLOSE: '15:45'
        run: |
          git config user.name "psx-bot"
          git config user.email "actions@users.noreply.github.com"
          # The FIRST cycle after the open runs in --fast mode: no news fetch,
          # no outcome grading. Neither can change today's signals (news weight
          # is 0.0; grading judges past runs), and dropping them gets the
          # morning's signals committed ~30s sooner. Every later cycle is full.
          first_cycle=1
          # force_now: a manually dispatched single cycle for testing the
          # pipeline end to end outside session hours. It skips the day/open/
          # close guards and exits after ONE cycle, so it can never turn into a
          # loop spinning through the night. Signals it produces reflect the
          # last available prices, not live trading — that is the point of it
          # being opt-in per dispatch rather than a relaxed guard.
          FORCE_NOW="${{ inputs.force_now }}"
          # A forced cycle takes the FULL path, not --fast: the point of it is
          # to exercise the news fetch and grading, which --fast skips.
          [ "$FORCE_NOW" = "true" ] && first_cycle=0
          while true; do
            dow=$(date +%u)          # 1=Mon .. 7=Sun
            now=$(date +%H:%M)
            if [ "$FORCE_NOW" = "true" ]; then
              echo "=== FORCED single cycle at $now PKT (session guards bypassed) ==="
            else
            if [ "$dow" -gt 5 ]; then echo "Weekend — exiting loop."; exit 0; fi
            if [[ "$now" > "$MARKET_CLOSE" ]]; then
              echo "Past market close ($now > $MARKET_CLOSE) — exiting loop."; exit 0; fi
            if [[ "$now" < "$MARKET_OPEN" ]]; then
              # 60s, not 300s: a 5-minute poll could idle until 09:37 before
              # noticing the market had opened. The user wants signals by ~09:35,
              # so the first cycle must start within a minute of the open.
              echo "Before open ($now < $MARKET_OPEN) — waiting."; sleep 60; continue; fi
            fi

            echo "=== Cycle at $now PKT ==="
            # Adopt the newest committed DB BEFORE running. Without this, a run
            # that was queued earlier (cron/pinger backlog released when another
            # loop ends) keeps the psx_engine.db from ITS checkout — an older
            # snapshot — and pushes it over newer work. That silently reverted a
            # full `regrade` twice on 2026-08-13. The binary DB cannot 3-way
            # merge, so freshest-wins-on-entry is the only safe rule; the
            # post-run push below still keeps THIS cycle's results.
            # Tradeoff: if every push retry of the PREVIOUS cycle failed, this
            # discards that cycle's rows. Acceptable — the next run regenerates
            # current signals, whereas a reverted regrade is invisible and
            # corrupts the accuracy stats until someone re-checks the win rate.
            # It also re-adopts the newest CODE, so a long-lived loop cannot keep
            # running a stale engine for hours after a push.
            git fetch origin "${{ github.ref_name }}" --quiet || true
            git reset --hard "origin/${{ github.ref_name }}" --quiet || true

            # Capture the traceback. `|| echo` used to swallow it: the loop kept
            # committing (the news table still grew, so the commit succeeded) while
            # `runs` stayed frozen — a green-looking workflow producing no signals.
            # On failure the traceback is committed so it is readable without
            # waiting for the 6h job to end and release its step log.
            if [ "$first_cycle" = "1" ]; then FAST="--fast"; else FAST=""; fi
            first_cycle=0
            if python main.py run $FAST > /tmp/psx_run.log 2>&1; then
              cat /tmp/psx_run.log
              rm -f engine_last_error.log
            else
              cat /tmp/psx_run.log
              { echo "main.py run FAILED at $(date -u +'%Y-%m-%dT%H:%M:%SZ')";
                echo; tail -120 /tmp/psx_run.log; } > engine_last_error.log
            fi

            # -f: *.log is gitignored, and a plain `git add` of an ignored path
            # exits non-zero, which killed the whole step under `set -e`.
            git add -A -- psx_engine.db
            git add -f engine_last_error.log 2>/dev/null || true
            if git commit -m "Automated run $(date -u +'%Y-%m-%dT%H:%MZ')"; then
              for attempt in 1 2 3 4 5; do
                git pull --rebase -X theirs --autostash origin "${{ github.ref_name }}" \
                  || git rebase --abort
                if git push; then echo "pushed on attempt $attempt"; break; fi
                echo "push raced, retrying ($attempt)..."; sleep 5
              done
            else
              echo "No data changes to commit this cycle."
            fi

            # Stop before sleeping if the next cycle would land after close.
            now=$(date +%H:%M)
            if [[ "$now" > "$MARKET_CLOSE" ]]; then
              echo "Reached close after cycle — exiting."; exit 0; fi
            echo "Sleeping ${RUN_INTERVAL_MINUTES}m before next cycle..."
            if [ "$FORCE_NOW" = "true" ]; then
              echo "Forced single cycle done — exiting."; exit 0; fi
            sleep "$((RUN_INTERVAL_MINUTES * 60))"
          done
