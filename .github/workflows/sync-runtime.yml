name: Sync main code into runtime-state and dashboard-stable

# The engine loop checks out runtime-state and runs ITS code. Nothing carried
# main's code there, so fixes on main silently never ran: on 2026-09-30 the
# loop was still calling PSX paths that main had already replaced, and on
# 2026-10-01 a dashboard fix sat unused the same way.
#
# This merges main into runtime-state after every code change. Runtime data
# stays exactly as runtime-state has it: main untracks those files for the
# Streamlit deployment, while the loop still commits them there. Any other
# conflict stops the sync loudly; it is never resolved by picking a side.
#
# A loop already running keeps the script it started with. New code reaches
# the next worker; restart the loop if a fix is needed mid-session.

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '.github/workflows/**'
      - 'requirements*.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-runtime
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: runtime-state
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Merge main, keep runtime data, test, push
        env:
          # Runtime data owned by runtime-state. Kept from runtime-state on
          # every merge, whatever main did to them.
          KEEP: >-
            .gitignore psx_engine.db dashboard_snapshot.json news_raw_24h.json
            intraday_observations.db intraday_momentum.json .engine-state.json
            short_horizon_inputs.json short_horizon_latest.json
            short_horizon_status.json engine_last_error.log
        run: |
          git config user.name "psx-sync"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main runtime-state
            git reset -q --hard origin/runtime-state
            if git merge-base --is-ancestor origin/main HEAD; then
              echo "runtime-state already has main's code"; exit 0
            fi
            git merge --no-ff --no-commit origin/main >/dev/null 2>&1 || true
            for f in $KEEP; do
              if git cat-file -e "origin/runtime-state:$f" 2>/dev/null; then
                git checkout origin/runtime-state -- "$f"
              fi
            done
            left=$(git diff --name-only --diff-filter=U)
            if [ -n "$left" ]; then
              echo "::error::Conflicts outside runtime data need a person: $left"
              git merge --abort; exit 1
            fi
            python -m compileall -q . >/dev/null
            # Tests may rewrite the snapshot; restore it before committing.
            python -m unittest discover -q 2>&1 | tail -3
            test "${PIPESTATUS[0]}" -eq 0 || { echo "::error::tests failed on the merged tree"; exit 1; }
            git checkout origin/runtime-state -- dashboard_snapshot.json 2>/dev/null || true
            git commit -q -m "Sync main $(git rev-parse --short origin/main) into runtime-state" \
                          -m "Code from main; runtime data kept as runtime-state has it."
            if git push origin HEAD:runtime-state; then
              echo "synced main $(git rev-parse --short origin/main)"; exit 0
            fi
            echo "runtime-state moved during the sync (engine push); redoing the merge"
            sleep $((attempt * 10))
          done
          echo "::error::runtime-state kept moving; sync not pushed"; exit 1

  # The dashboard deploys from dashboard-stable. It froze at 2026-09-28 and
  # no dashboard fix reached it for four days. It now follows main on CODE
  # changes only (this workflow's path filter), so data commits still do not
  # restart the app; the dashboard reads its data live (remote_data.py).
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: dashboard-stable
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Merge main, test, push
        run: |
          git config user.name "psx-sync"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main dashboard-stable
            git reset -q --hard origin/dashboard-stable
            if git merge-base --is-ancestor origin/main HEAD; then
              echo "dashboard-stable already has main's code"; exit 0
            fi
            if ! git merge --no-ff --no-commit origin/main >/dev/null 2>&1; then
              left=$(git diff --name-only --diff-filter=U)
              echo "::error::Conflicts need a person: $left"; git merge --abort; exit 1
            fi
            python -m compileall -q . >/dev/null
            python -m unittest discover -q 2>&1 | tail -3
            test "${PIPESTATUS[0]}" -eq 0 || { echo "::error::tests failed on the merged tree"; exit 1; }
            git checkout origin/main -- dashboard_snapshot.json 2>/dev/null || true
            git commit -q -m "Sync main $(git rev-parse --short origin/main) into dashboard-stable"
            if git push origin HEAD:dashboard-stable; then
              echo "synced main $(git rev-parse --short origin/main)"; exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::error::dashboard-stable sync not pushed"; exit 1
