name: Publish reviewed candle research
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: psx-candle-research-deploy
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-ci.txt 'plotly>=5,<7'
      - name: Apply the reviewed source patch
        run: |
          echo "3df1c88f319c243e091ac04ccca2c293c1e92f4df0f37331e6da9d27afd02141  candle-research.patch" | sha256sum -c -
          git apply --check candle-research.patch
          git apply --index candle-research.patch
      - name: Verify the complete change in the cloud
        run: |
          python -m unittest discover -q
          python -m unittest discover -s tools/candle_research -q
          python -m compileall -q .
          git diff --exit-code -- psx_engine.db portfolio.json
          git restore --worktree dashboard_snapshot.json
      - name: Publish to main and remove this temporary installer
        run: |
          git config user.name "psx-candle-research"
          git config user.email "actions@users.noreply.github.com"
          git rm -- candle-research.patch .github/workflows/candle-research-bootstrap.yml
          git commit -m "Audit 60-stock candle evidence and add validated daily cloud research" \
            -m "Preserve live rules. Freeze research ideas, record costs/coverage and retain pending outcomes. Fix Windows database handle cleanup. Validation: full engine and research suites in cloud."
          python runtime_publish.py main
